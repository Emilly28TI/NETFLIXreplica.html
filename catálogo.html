<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Netflix</title>
    <link rel="stylesheet" href="./cat.css">
</head>
<body>
    <header>
        <h1>Netflix</h1>
        <div class="menu">
            <a href="#">Início</a>
            <a href="#">Séries</a>
            <a href="#">Filmes</a>
            <a href="#">Bombou</a>
            <a href="#">Minha Lista</a>
        </div>
    </header>

    <section class="sectionBanner">
        <div class="banner">
            <h2>A Terra Prometida</h2>
            <p>Uma breve introdução ao filme:</p>
            <div class="organizadorButton1">
                <button class="buton buton-play">Play</button>
                <button class="buton buton-info">Info</button>
            </div>
        </div>
    </section>

    <section class="sectionFilmes">
        <div class="organizadorFilmes">
            <h2>Coleção de Favoritos:</h2>
            <div class="listaFilmes">
                <a href="#" class="cardFilme">
                    <img src="https://upload.wikimedia.org/wikipedia/pt/9/91/Logotipo_de_Os_Dez_Mandamentos.png" alt="Poster Os Dez Mandamentos">
                    <p>Os Dez Mandamentos</p>
                </a>
                <a href="#" class="cardFilme">
                    <img src="https://upload.wikimedia.org/wikipedia/pt/e/e1/G%C3%AAnesis_logo.jpeg" alt="Poster Gênesis">
                    <p>Gênesis</p>
                </a>
                <a href="#" class="cardFilme">
                    <img src="https://upload.wikimedia.org/wikipedia/pt/6/68/Logotipo_de_Reis.jpg" alt="Poster Reis">
                    <p>Reis</p>
                </a>
                <a href="#" class="cardFilme">
                    <img src="https://upload.wikimedia.org/wikipedia/pt/d/df/O_Rico_e_L%C3%A1zaro.jpg" alt="Poster O Rico e o Lázaro">
                    <p>O Rico e o Lázaro</p>
                </a>
                <a href="#" class="cardFilme">
                    <img src="https://amonovelas.com.br/wp-content/uploads/2018/07/novela-jesus.jpg" alt="Poster Jesus">
                    <p>Jesus</p>
                </a>
                <a href="#" class="cardFilme">
                    <img src="https://static.wikia.nocookie.net/tvpediabrasil/images/9/97/Apocalipse.jpg/revision/latest?cb=20171220203515" alt="Poster Apocalipse">
                    <p>Apocalipse</p>
                </a>
            </div>
        </div>
    </section>
</body>
</html>
